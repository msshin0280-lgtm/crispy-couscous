<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>삼성전자 재무 대시보드</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h3 {
    color: #666;
    font-size: 14px;
}

.value {
    font-size: 24px;
    font-weight: bold;
}

.chart {
    margin-top: 25px;
    padding: 20px;
    background: white;
    border-radius: 12px;
}

.status {
    margin-top: 20px;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

<h1>삼성전자 재무 대시보드</h1>

<div class="subtitle">
DART OpenAPI 기반 자동 재무분석
</div>

<div class="cards">

<div class="card">
<h3>매출액</h3>
<div class="value" id="revenue">-</div>
</div>

<div class="card">
<h3>영업이익</h3>
<div class="value" id="operating_profit">-</div>
</div>

<div class="card">
<h3>당기순이익</h3>
<div class="value" id="net_income">-</div>
</div>

<div class="card">
<h3>영업이익률</h3>
<div class="value" id="operating_margin">-</div>
</div>

<div class="card">
<h3>ROE</h3>
<div class="value" id="roe">-</div>
</div>

<div class="card">
<h3>부채비율</h3>
<div class="value" id="debt_ratio">-</div>
</div>

</div>

<div class="chart">

<h2>연도별 매출 / 영업이익</h2>

<canvas id="financialChart"></canvas>

</div>

<div class="status" id="status">
데이터를 불러오는 중...
</div>

</div>

<script>

async function loadData() {

    try {

        const response =
            await fetch("data.json");

        const data =
            await response.json();

        console.log(data);

        document.getElementById("status")
            .innerText =
            "DART 데이터 연결 완료";

        /*
         * 현재 data.json 구조에 맞춰
         * 다음 단계에서 자동 연결합니다.
         */

        if (data.revenue) {

            document.getElementById("revenue")
                .innerText =
                formatMoney(data.revenue);

        }

        if (data.operating_profit) {

            document.getElementById("operating_profit")
                .innerText =
                formatMoney(data.operating_profit);

        }

        if (data.net_income) {

            document.getElementById("net_income")
                .innerText =
                formatMoney(data.net_income);

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById("status")
            .innerText =
            "데이터를 불러오지 못했습니다.";

    }

}


function formatMoney(value) {

    if (!value) return "-";

    return Number(value)
        .toLocaleString("ko-KR");

}


loadData();

</script>

</body>
</html>
