<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼성전자 재무 대시보드</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #666;
            font-size: 14px;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
        }

        .chart-box {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>삼성전자 재무 대시보드</h1>
    <div class="subtitle">
        DART 공시 기반 재무정보
    </div>

    <div class="cards">

        <div class="card">
            <h3>매출액</h3>
            <div class="value" id="revenue">-</div>
        </div>

        <div class="card">
            <h3>영업이익</h3>
            <div class="value" id="operatingProfit">-</div>
        </div>

        <div class="card">
            <h3>당기순이익</h3>
            <div class="value" id="netIncome">-</div>
        </div>

        <div class="card">
            <h3>영업이익률</h3>
            <div class="value" id="operatingMargin">-</div>
        </div>

        <div class="card">
            <h3>ROE</h3>
            <div class="value" id="roe">-</div>
        </div>

        <div class="card">
            <h3>부채비율</h3>
            <div class="value" id="debtRatio">-</div>
        </div>

    </div>

    <div class="chart-box">
        <h2>매출 및 영업이익 추이</h2>
        <canvas id="financialChart"></canvas>
    </div>

</div>

<script>

async function loadData() {

    try {

        const response = await fetch("../data/financial_data.json");

        const data = await response.json();

        const years = Object.keys(data).sort();

        const latestYear = years[years.length - 1];

        const latest = data[latestYear].financials;

        const financials = latest;

        document.getElementById("revenue").innerText =
            formatNumber(financials.revenue);

        document.getElementById("operatingProfit").innerText =
            formatNumber(financials.operating_profit);

        document.getElementById("netIncome").innerText =
            formatNumber(financials.net_income);

        document.getElementById("operatingMargin").innerText =
            financials.ratios.operating_margin.toFixed(2) + "%";

        document.getElementById("roe").innerText =
            financials.ratios.roe.toFixed(2) + "%";

        document.getElementById("debtRatio").innerText =
            financials.ratios.debt_ratio.toFixed(2) + "%";


        const revenue = [];
        const operatingProfit = [];

        years.forEach(year => {

            const f = data[year].financials;

            revenue.push(f.revenue / 1000000);
            operatingProfit.push(f.operating_profit / 1000000);

        });


        new Chart(
            document.getElementById("financialChart"),
            {
                type: "bar",

                data: {
                    labels: years,

                    datasets: [
                        {
                            label: "매출액 (조원)",
                            data: revenue
                        },
                        {
                            label: "영업이익 (조원)",
                            data: operatingProfit
                        }
                    ]
                },

                options: {
                    responsive: true
                }
            }
        );

    } catch (error) {

        console.error(error);

    }

}


function formatNumber(value) {

    if (!value) {
        return "-";
    }

    return (value / 1000000).toFixed(2) + "조원";

}


loadData();

</script>

</body>
</html>
