<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼성전자 재무 분석 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; }
        h1 { text-align: center; color: #0a58ca; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 45%; min-width: 350px; }
    </style>
</head>
<body>

    <h1>📊 삼성전자(DART) 주요 재무수치 및 비율 분석</h1>

    <div class="container">
        <div class="card">
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="card">
            <canvas id="ratioChart"></canvas>
        </div>
    </div>

    <script>
        async function loadData() {
            const response = await fetch('./data.json');
            const data = await response.json();

            const years = data.map(d => d.year + '년');
            const revenues = data.map(d => d.revenue / 1e12); // 조 원 단위
            const opIncomes = data.map(d => d.operating_income / 1e12);
            const opMargins = data.map(d => d.op_margin);
            const roes = data.map(d => d.roe);

            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [
                        { label: '매출액 (조 원)', data: revenues, backgroundColor: '#3b82f6' },
                        { label: '영업이익 (조 원)', data: opIncomes, backgroundColor: '#10b981' }
                    ]
                },
                options: { responsive: true, plugins: { title: { display: true, text: '매출액 및 영업이익 추이' } } }
            });

            new Chart(document.getElementById('ratioChart'), {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [
                        { label: '영업이익률 (%)', data: opMargins, borderColor: '#f59e0b', fill: false },
                        { label: 'ROE (%)', data: roes, borderColor: '#ef4444', fill: false }
                    ]
                },
                options: { responsive: true, plugins: { title: { display: true, text: '주요 재무비율 추이 (영업이익률 & ROE)' } } }
            });
        }

        loadData();
    </script>
</body>
</html>
